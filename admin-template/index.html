<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Template – Dashboard</title>
<link href="assets/css/poppins.css" rel="stylesheet">
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard">

<div id="topbar-root"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="row g-4">
      <div class="col-xl-8">
        <section class="card-soft hero mb-5">
          <h1>Hello John!</h1>
          <p>Yorem ipsum dolor sit amet, consectetur adipiscing elit. Nunc vulputate libero et.</p>
          <button class="btn btn-navy mt-3">Write new post!</button>
          <i class="fa-solid fa-pencil art d-none d-md-block"></i>
        </section>

        <section class="card-soft top-articles">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="section-title mb-0">Top articles</h2>
            <div class="dropdown month-pick">
              <button class="dropdown-toggle" data-bs-toggle="dropdown"><i class="fa-regular fa-calendar me-2"></i><span id="monthLabel">January</span></button>
              <ul class="dropdown-menu dropdown-menu-end" id="monthMenu"></ul>
            </div>
          </div>
          <div id="articleList"></div>
        </section>
      </div>

      <div class="col-xl-4">
        <div class="d-grid gap-4 mb-4">
          <div class="stat blue"><div class="ico"><i class="fa-solid fa-sack-dollar"></i></div>
            <div><div class="num">Rp 20.000.000</div><div class="lbl">Total earning</div></div></div>
          <div class="stat purple"><div class="ico"><i class="fa-solid fa-pen-to-square"></i></div>
            <div><div class="num">13</div><div class="lbl">Request Article</div></div></div>
          <div class="stat pink"><div class="ico"><i class="fa-solid fa-gauge-high"></i></div>
            <div><div class="num">10</div><div class="lbl">Pending articles</div></div></div>
        </div>

        <section class="today">
          <div class="today-head"><span>Today's article</span><span>January <i class="fa-regular fa-calendar ms-1"></i></span></div>
          <div class="week" id="week"></div>
          <div class="agenda" id="agenda"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/dashboard.js"></script>
</body>
</html>
