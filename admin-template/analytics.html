<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Template – Analytics</title>
<link href="assets/css/poppins.css" rel="stylesheet">
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/vendor/fontawesome/css/all.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="analytics">

<div id="topbar-root"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-head d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h1 class="page-title">Analytics</h1>
        <p class="page-sub">Article and audience performance.</p>
      </div>
      <select class="form-select" style="max-width:180px">
        <option>Last 30 days</option>
        <option>Last 7 days</option>
        <option>This month</option>
        <option>This year</option>
      </select>
    </div>

    <!-- Stat cards -->
    <div class="row g-3">
      <div class="col-sm-6 col-xl-3">
        <div class="demo-card mb-3">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="text-muted">Page Views</div>
              <div class="fs-3 fw-bold" style="color:var(--navy)">128.4K</div>
            </div>
            <span class="badge badge-soft-success badge-pill"><i class="fa-solid fa-arrow-trend-up me-1"></i>12%</span>
          </div>
          <div id="aSpark1" style="height:52px"></div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="demo-card mb-3">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="text-muted">Unique Visitors</div>
              <div class="fs-3 fw-bold" style="color:var(--navy)">42,180</div>
            </div>
            <span class="badge badge-soft-success badge-pill"><i class="fa-solid fa-arrow-trend-up me-1"></i>6%</span>
          </div>
          <div id="aSpark2" style="height:52px"></div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="demo-card mb-3">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="text-muted">Avg. Session</div>
              <div class="fs-3 fw-bold" style="color:var(--navy)">4m 32s</div>
            </div>
            <span class="badge badge-soft-danger badge-pill"><i class="fa-solid fa-arrow-trend-down me-1"></i>2%</span>
          </div>
          <div id="aSpark3" style="height:52px"></div>
        </div>
      </div>
      <div class="col-sm-6 col-xl-3">
        <div class="demo-card mb-3">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="text-muted">Bounce Rate</div>
              <div class="fs-3 fw-bold" style="color:var(--navy)">38.6%</div>
            </div>
            <span class="badge badge-soft-success badge-pill"><i class="fa-solid fa-arrow-trend-down me-1"></i>4%</span>
          </div>
          <div id="aSpark4" style="height:52px"></div>
        </div>
      </div>
    </div>

    <!-- Traffic overview -->
    <div class="demo-card">
      <div class="demo-title">Traffic Overview</div>
      <div id="aTraffic" style="height:320px"></div>
    </div>

    <div class="row g-3">
      <div class="col-xl-7">
        <div class="demo-card">
          <div class="demo-title">Top Pages</div>
          <div id="aPages" style="height:300px"></div>
        </div>
      </div>
      <div class="col-xl-5">
        <div class="demo-card">
          <div class="demo-title">Devices</div>
          <div id="aDevices" style="height:300px"></div>
        </div>
      </div>
    </div>

    <div class="demo-card mb-0">
      <div class="demo-title">Top Countries</div>
      <div id="aCountries" style="height:300px"></div>
    </div>
  </main>
</div>

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/highcharts/highcharts.js"></script>
<script src="assets/vendor/highcharts/accessibility.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/analytics.js"></script>
</body>
</html>
